name: Deploy to Cloud Run

env:
  SERVICE_NAME: custom-fastapi-service
  PROJECT_ID: wedge-golf-dev
  DOCKER_IMAGE_URL: us-central1-docker.pkg.dev/wedge-golf-dev/custom-fastapi/custom-fastapi

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  dockerize-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Google Cloud Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          gcloud builds submit --config=cloudbuild.yaml --project  ${{ env.PROJECT_ID }} .

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace service.yaml --region us-east1 --project ${{ env.PROJECT_ID }}